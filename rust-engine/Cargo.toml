[package]
name = "akkord-pdf-engine"
version = "0.4.0"
edition = "2021"
description = "High-performance Rust PDF Vision, Staff/TAB Detection, Ink-Collision Avoidance, and Vector Annotation Engine for Akkord"
license = "Apache-2.0"

[[bin]]
name = "akkord-pdf-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
lopdf = "0.34"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
